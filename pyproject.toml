[project]
name = "horae-marketplace"
version = "0.0.0"
description = "Verification tooling for the Horae marketplace index (marketplace.json)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<4.27"]

[project.scripts]
marketplace-verify = "horae_marketplace.verify:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horae_marketplace"]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "ruff>=0.17", "types-jsonschema>=4.26"]

[tool.uv]
required-version = ">=0.13"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# horae is installed from git main only by the verify job; type-checking does not need it.
[[tool.mypy.overrides]]
module = ["horae", "horae.*"]
ignore_missing_imports = true
