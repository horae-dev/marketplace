name: Nightly

# Runs every pinned plugin's own tests at its pinned SHA against the latest core (horae-sdk and
# horae from main) and opens or updates one issue when something breaks.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

env:
  UV_PYTHON_PREFERENCE: only-managed
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the matrix from marketplace.json
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(UV_LOCKED=1 uv run marketplace-verify --matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "count=$(echo "${matrix}" | jq '.include | length')" >> "${GITHUB_OUTPUT}"

  test:
    name: Test ${{ matrix.name }}@${{ matrix.version }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Plugin code is third-party: no token beyond read access to this public repository, no secrets.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PLUGIN_NAME: ${{ matrix.name }}
      PLUGIN_VERSION: ${{ matrix.version }}
      PLUGIN_REPO: ${{ matrix.repo }}
      PLUGIN_SHA: ${{ matrix.sha }}
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check out the plugin at its pinned SHA
        run: |
          set -euo pipefail
          git init --quiet plugin
          cd plugin
          git -c protocol.allow=never -c protocol.https.allow=always \
            fetch --quiet --depth 1 -- "${PLUGIN_REPO}" "${PLUGIN_SHA}"
          git checkout --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${PLUGIN_SHA}"
      - name: Run the plugin tests against core main
        id: tests
        working-directory: plugin
        run: |
          set -o pipefail
          # Move the core dependency (horae-sdk) to the latest main instead of the plugin's lock.
          uv sync --upgrade-package horae-sdk
          uv run pytest -q 2>&1 | tee ../pytest.log
      - name: Record the result
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p result
          {
            echo "plugin: ${PLUGIN_NAME}@${PLUGIN_VERSION} (${PLUGIN_SHA})"
            echo "outcome: ${OUTCOME}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            tail -n 40 pytest.log 2>/dev/null || true
          } > "result/${PLUGIN_NAME}-${PLUGIN_VERSION}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: result-${{ matrix.name }}-${{ matrix.version }}
          path: result/
          retention-days: 3

  report:
    name: Report breakage
    needs: [plan, test]
    if: ${{ always() && needs.test.result != 'skipped' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Open or update the breakage issue
        run: |
          set -euo pipefail
          title="Nightly: plugin tests fail against core main"
          failed="$(grep -l '^outcome: failure' results/*.txt 2>/dev/null || true)"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -z "${failed}" ] && [ "${TEST_RESULT}" = "success" ]; then
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "Nightly run ${GITHUB_RUN_ID} is green again. Close this issue if nothing else is pending."
            fi
            exit 0
          fi
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -z "${failed}" ]; then
              echo "The test job ended as \`${TEST_RESULT}\` without a recorded plugin failure; see the run."
            fi
            for f in ${failed}; do
              echo '<details><summary>'"$(sed -n 1p "$f")"'</summary>'
              echo
              echo '```'
              tail -n +4 "$f"
              echo '```'
              echo '</details>'
            done
          } > body.md
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md
          fi
